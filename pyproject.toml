[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frequency-nebius-assurance"
version = "0.1.0"
description = "Open Nebius Token Factory adapter and bounded execution-evidence harness for Frequency"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Val Rukhaylo / Altru.dev"}]

[project.scripts]
frequency-nebius = "frequency_nebius.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
